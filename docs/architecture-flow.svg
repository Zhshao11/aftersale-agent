<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1010" width="680" height="1010" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">售后咨询全链路流程图</title>
<desc id="flow-desc">用户请求经意图路由分流：查询类走只读工具直接回答；写操作由 LLM 生成结构化计划，经白名单、归属、政策三重确定性校验后落库，等待用户确认，金额不低于 500 美元触发二次确认，确认时重算上下文指纹，最后由 Executor 以幂等键执行，明确失败重试不超过 3 次，结果未知转对账补偿。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.dom-info{fill:#E6F1FB;stroke:#85B7EB}
.dom-warn{fill:#FAEEDA;stroke:#EF9F27}
.dom-ok{fill:#EAF3DE;stroke:#97C459}
.tx-info{fill:#0C447C}
.tx-warn{fill:#633806}
.tx-ok{fill:#27500A}
.node{fill:#FFFFFF;stroke:#B4B2A9}
.t1{fill:#2C2C2A}
.t2{fill:#5F5E5A}
.edge{stroke:#888780}
@media (prefers-color-scheme:dark){
.dom-info{fill:#0C447C;stroke:#85B7EB}
.dom-warn{fill:#633806;stroke:#EF9F27}
.dom-ok{fill:#27500A;stroke:#97C459}
.tx-info{fill:#B5D4F4}
.tx-warn{fill:#FAC775}
.tx-ok{fill:#C0DD97}
.node{fill:#2C2C2A;stroke:#5F5E5A}
.t1{fill:#F1EFE8}
.t2{fill:#B4B2A9}
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="dom-info" x="40" y="40" width="600" height="296" rx="16" stroke-width="0.5"/>
<text class="tx-info" x="62" y="66" font-size="13" font-weight="500" dominant-baseline="central">LLM 可见域</text>
<text class="tx-info" x="618" y="66" font-size="12" text-anchor="end" dominant-baseline="central">只有只读工具</text>

<rect class="node" x="170" y="86" width="340" height="52" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="103" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">用户：帮我退掉这一单</text>
<text class="t2" x="340" y="123" font-size="12" text-anchor="middle" dominant-baseline="central">自然语言 · 无结构</text>

<line class="edge" x1="340" y1="138" x2="340" y2="162" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="node" x="170" y="166" width="340" height="52" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="183" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">意图路由</text>
<text class="t2" x="340" y="203" font-size="12" text-anchor="middle" dominant-baseline="central">分类 QUERY / WRITE，失败保守归 QUERY</text>

<line class="edge" x1="340" y1="218" x2="340" y2="248" stroke-width="1.5" marker-end="url(#arrow)"/>
<path class="edge" d="M340 233 H570 V248" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="node" x="200" y="252" width="280" height="64" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="274" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">WRITE · LLM 生成结构化计划</text>
<text class="t2" x="340" y="296" font-size="12" text-anchor="middle" dominant-baseline="central">只描述意图，看不到写工具</text>

<rect class="node" x="500" y="252" width="140" height="64" rx="8" stroke-width="0.5"/>
<text class="t1" x="570" y="274" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">QUERY</text>
<text class="t2" x="570" y="296" font-size="12" text-anchor="middle" dominant-baseline="central">只读工具直接回答</text>

<line class="edge" x1="340" y1="316" x2="340" y2="402" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="dom-warn" x="40" y="364" width="600" height="302" rx="16" stroke-width="0.5"/>
<text class="tx-warn" x="62" y="390" font-size="13" font-weight="500" dominant-baseline="central">确定性校验域</text>
<text class="tx-warn" x="618" y="390" font-size="12" text-anchor="end" dominant-baseline="central">纯代码校验，不依赖 LLM</text>

<rect class="node" x="200" y="406" width="280" height="64" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="428" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">白名单 · 归属 · 政策 三重校验</text>
<text class="t2" x="340" y="450" font-size="12" text-anchor="middle" dominant-baseline="central">工具合法 · 订单属于本人 · 状态允许</text>

<line class="edge" x1="340" y1="470" x2="340" y2="490" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="node" x="200" y="494" width="280" height="64" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="516" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">落库 PENDING_CONFIRM</text>
<text class="t2" x="340" y="538" font-size="12" text-anchor="middle" dominant-baseline="central">计划卡片推给用户，等待确认</text>

<path class="edge" d="M484 526 H516" fill="none" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="tx-warn" x="522" y="518" font-size="12" font-weight="500" dominant-baseline="central">金额 ≥ $500</text>
<text class="t2" x="522" y="538" font-size="12" dominant-baseline="central">触发二次确认</text>

<line class="edge" x1="340" y1="558" x2="340" y2="578" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="node" x="200" y="582" width="280" height="64" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="604" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">确认时重算上下文指纹</text>
<text class="t2" x="340" y="626" font-size="12" text-anchor="middle" dominant-baseline="central">SHA-256，条件变化则旧计划作废</text>

<line class="edge" x1="340" y1="646" x2="340" y2="732" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="dom-ok" x="40" y="694" width="600" height="290" rx="16" stroke-width="0.5"/>
<text class="tx-ok" x="62" y="720" font-size="13" font-weight="500" dominant-baseline="central">执行域</text>
<text class="tx-ok" x="618" y="720" font-size="12" text-anchor="end" dominant-baseline="central">写工具只存在这里</text>

<rect class="node" x="200" y="736" width="280" height="64" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="758" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Executor 执行写操作</text>
<text class="t2" x="340" y="780" font-size="12" text-anchor="middle" dominant-baseline="central">幂等键抢占，重复请求回放结果</text>

<line class="edge" x1="340" y1="800" x2="340" y2="820" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="node" x="200" y="824" width="280" height="64" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="846" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">超时结果二分</text>
<text class="t2" x="340" y="868" font-size="12" text-anchor="middle" dominant-baseline="central">区分明确失败与结果未知</text>

<path class="edge" d="M484 856 H516" fill="none" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="tx-warn" x="522" y="848" font-size="12" font-weight="500" dominant-baseline="central">失败 → 重试 ≤3</text>
<text class="t2" x="522" y="868" font-size="12" dominant-baseline="central">未知 → 对账补偿</text>

<line class="edge" x1="340" y1="888" x2="340" y2="908" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="node" x="200" y="912" width="280" height="52" rx="8" stroke-width="0.5"/>
<text class="t1" x="340" y="938" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">订单终态：REFUNDED / CANCELLED</text>
</svg>
